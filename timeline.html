<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アニマン共有タイムライン</title>
    <style>
        /* 全体のスタイル（CSS） */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f8fa;
            color: #14171a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            min-height: 100vh;
            border-left: 1px solid #e6ecf0;
            border-right: 1px solid #e6ecf0;
        }
        header {
            background-color: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #e6ecf0;
            position: sticky;
            top: 0;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 100;
        }
        /* 投稿フォームのスタイル */
        .post-form {
            padding: 20px;
            border-bottom: 8px solid #e6ecf0;
        }
        .post-form input, .post-form textarea {
            width: 100%;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .post-form textarea {
            resize: none;
            height: 80px;
        }
        .post-form button {
            background-color: #1da1f2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
        .post-form button:hover {
            background-color: #0c85d0;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        /* タイムラインの投稿スタイル */
        .post {
            padding: 15px 20px;
            border-bottom: 1px solid #e6ecf0;
        }
        .post .title {
            font-weight: bold;
            color: #1da1f2;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        .post .text {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .post .time {
            font-size: 0.8rem;
            color: #657786;
        }
    </style>
</head>
<body>

<div class="container">
    <header>ホーム</header>

    <!-- 投稿フォーム -->
    <div class="post-form clearfix">
        <form id="postForm">
            <input type="text" id="workTitle" placeholder="作品名（例：呪術廻戦）" required>
            <textarea id="recommendText" placeholder="おすすめポイントを教えてください！" required></textarea>
            <button type="submit">投稿する</button>
        </form>
    </div>

    <!-- タイムライン（ここに投稿が追加されます） -->
    <div id="timeline">
        <!-- サンプル投稿 -->
        <div class="post">
            <div class="title">【アニメ】葬送のフリーレン</div>
            <div class="text">作画がとにかく綺麗で、時間の流れや寿命について考えさせられる名作です。毎話泣けます。</div>
            <div class="time">2026/08/24 12:00</div>
        </div>
    </div>
</div>

<script>
    // JavaScriptで動きを作る
    const postForm = document.getElementById('postForm');
    const timeline = document.getElementById('timeline');

    // フォームが送信されたときの処理
    postForm.addEventListener('submit', function(event) {
        event.preventDefault(); // 画面がリロードされるのを防ぐ

        // 入力された値を取得
        const title = document.getElementById('workTitle').value;
        const text = document.getElementById('recommendText').value;
        
        // 現在の日時を取得
        const now = new Date();
        const timeString = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        // 新しい投稿のHTMLを作成
        const postHTML = `
            <div class="post">
                <div class="title">【おすすめ】${title}</div>
                <div class="text">${text.replace(/\n/g, '<br>')}</div>
                <div class="time">${timeString}</div>
            </div>
        `;

        // タイムラインの一番上に追加（prepend）
        timeline.insertAdjacentHTML('afterbegin', postHTML);

        // 入力欄を空にする
        postForm.reset();
    });
</script>

</body>
</html>
